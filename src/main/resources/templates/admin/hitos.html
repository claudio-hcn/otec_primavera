<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hitos - OTEC Primavera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar {
            min-height: 100vh;
            background-color: #2e7d32;
        }
        .sidebar a {
            color: #c8e6c9;
            text-decoration: none;
            display: block;
            padding: 12px 20px;
        }
        .sidebar a:hover {
            background-color: #1b5e20;
            color: white;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-0">
            <div class="text-white text-center py-4">
                <h5>🌱 OTEC Primavera</h5>
            </div>
            <a th:href="@{/admin/dashboard}">📊 Dashboard</a>
            <a th:href="@{/admin/programas}">📚 Programas</a>
            <a th:href="@{/admin/estudiantes}">👥 Estudiantes</a>
            <a th:href="@{/admin/matriculas}">📋 Matrículas</a>
            <hr style="border-color: #4caf50;">
            <a th:href="@{/logout}">🚪 Cerrar Sesión</a>
        </div>

        <!-- Contenido principal -->
        <div class="col-md-10 p-4">
            <h3 class="mb-1">Hitos de la Matrícula</h3>
            <p class="text-muted mb-4"
               th:text="${nombreEstudiante + ' — ' + nombrePrograma}">
            </p>

            <!-- Mensaje de error -->
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <!-- Formulario registro hito -->
            <div class="card mb-4">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Registrar nuevo hito</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/hitos/guardar}" method="post">
                        <input type="hidden" name="matriculaId" th:value="${matriculaId}">
                        <div class="row">
                            <div class="col-md-3 mb-3">
                                <label class="form-label">Tipo</label>
                                <select name="tipo" class="form-select" required>
                                    <option value="EVALUACION">Evaluación</option>
                                    <option value="MODULO_COMPLETADO">Módulo completado</option>
                                    <option value="ASISTENCIA">Asistencia</option>
                                </select>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label">Módulo</label>
                                <select name="moduloId" class="form-select" required>
                                    <option value="">Seleccionar módulo...</option>
                                    <option th:each="m : ${modulos}"
                                            th:value="${m.id}"
                                            th:text="${m.orden + '. ' + m.nombre}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-2 mb-3">
                                <label class="form-label">Nota (opcional)</label>
                                <input type="number" name="nota" step="0.1"
                                       min="1" max="7" class="form-control">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Observación</label>
                                <input type="text" name="observacion"
                                       class="form-control">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success">
                            Registrar Hito
                        </button>
                        <a th:href="@{/admin/matriculas}"
                           class="btn btn-outline-secondary ms-2">
                            Volver
                        </a>
                    </form>
                </div>
            </div>

            <!-- Tabla hitos -->
            <div class="card">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Hitos registrados</h5>
                </div>
                <div class="card-body">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Módulo</th>
                                <th>Tipo</th>
                                <th>Nota</th>
                                <th>Resultado</th>
                                <th>Fecha</th>
                                <th>Observación</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="h : ${hitos}">
                                <td th:text="${h.modulo.nombre}"></td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${h.tipo.name() == 'MODULO_COMPLETADO'} ? 'bg-success' :
                                                          (${h.tipo.name() == 'EVALUACION'} ? 'bg-primary' : 'bg-warning')"
                                          th:text="${h.tipo}">
                                    </span>
                                </td>
                                <td th:text="${h.nota != null} ? ${#numbers.formatDecimal(h.nota, 1, 1)} : '-'"></td>
                                <td>
                                    <span th:if="${h.aprobado != null}"
                                          class="badge"
                                          th:classappend="${h.aprobado} ? 'bg-success' : 'bg-danger'"
                                          th:text="${h.aprobado} ? 'Aprobado' : 'Reprobado'">
                                    </span>
                                    <span th:if="${h.aprobado == null}">-</span>
                                </td>
                                <td th:text="${h.fecha}"></td>
                                <td th:text="${h.observacion}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
