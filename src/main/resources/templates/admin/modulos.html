<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Módulos - OTEC Primavera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar {
            min-height: 100vh;
            background-color: #2e7d32;
        }
        .sidebar a {
            color: #c8e6c9;
            text-decoration: none;
            display: block;
            padding: 12px 20px;
        }
        .sidebar a:hover {
            background-color: #1b5e20;
            color: white;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-0">
            <div class="text-white text-center py-4">
                <h5>🌱 OTEC Primavera</h5>
            </div>
            <a th:href="@{/admin/dashboard}">📊 Dashboard</a>
            <a th:href="@{/admin/programas}">📚 Programas</a>
            <a th:href="@{/admin/estudiantes}">👥 Estudiantes</a>
            <a th:href="@{/admin/matriculas}">📋 Matrículas</a>
            <hr style="border-color: #4caf50;">
            <a th:href="@{/logout}">🚪 Cerrar Sesión</a>
        </div>

        <!-- Contenido principal -->
        <div class="col-md-10 p-4">
            <h3 class="mb-1">Módulos del Programa</h3>
            <p class="text-muted mb-4"
               th:text="${programa.nombre + ' - ' + programa.tecnologia}">
            </p>

            <!-- Formulario nuevo módulo -->
            <div class="card mb-4">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Agregar módulo</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/programas/{id}/modulos/guardar(id=${programa.id})}"
                          th:object="${nuevoModulo}" method="post">
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" th:field="*{nombre}"
                                       class="form-control" required>
                            </div>
                            <div class="col-md-5 mb-3">
                                <label class="form-label">Descripción</label>
                                <input type="text" th:field="*{descripcion}"
                                       class="form-control">
                            </div>
                            <div class="col-md-2 mb-3">
                                <label class="form-label">Orden</label>
                                <input type="number" th:field="*{orden}"
                                       class="form-control" required>
                            </div>
                            <div class="col-md-1 mb-3 d-flex align-items-end">
                                <button type="submit" class="btn btn-success w-100">
                                    +
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Tabla módulos -->
            <div class="card">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Módulos registrados</h5>
                </div>
                <div class="card-body">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Orden</th>
                                <th>Nombre</th>
                                <th>Descripción</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="m : ${modulos}">
                                <td th:text="${m.orden}"></td>
                                <td th:text="${m.nombre}"></td>
                                <td th:text="${m.descripcion}"></td>
                                <td>
                                    <a th:href="@{/admin/programas/{id}/modulos/eliminar/{moduloId}(id=${programa.id}, moduloId=${m.id})}"
                                       class="btn btn-sm btn-outline-danger"
                                       onclick="return confirm('¿Eliminar este módulo?')">
                                        Eliminar
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <a th:href="@{/admin/programas}"
               class="btn btn-outline-secondary mt-3">
                ← Volver a programas
            </a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
