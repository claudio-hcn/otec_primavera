<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Matrículas - OTEC Primavera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar {
            min-height: 100vh;
            background-color: #2e7d32;
        }
        .sidebar a {
            color: #c8e6c9;
            text-decoration: none;
            display: block;
            padding: 12px 20px;
        }
        .sidebar a:hover {
            background-color: #1b5e20;
            color: white;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-0">
            <div class="text-white text-center py-4">
                <h5>🌱 OTEC Primavera</h5>
            </div>
            <a th:href="@{/admin/dashboard}">📊 Dashboard</a>
            <a th:href="@{/admin/programas}">📚 Programas</a>
            <a th:href="@{/admin/estudiantes}">👥 Estudiantes</a>
            <a th:href="@{/admin/matriculas}">📋 Matrículas</a>
            <hr style="border-color: #4caf50;">
            <a th:href="@{/logout}">🚪 Cerrar Sesión</a>
        </div>

        <!-- Contenido principal -->
        <div class="col-md-10 p-4">
            <h3 class="mb-4">Gestión de Matrículas</h3>

            <!-- Formulario matrícula -->
            <div class="card mb-4">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Nueva Matrícula</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/matriculas/guardar}" method="post">
                        <div class="row">
                            <div class="col-md-5 mb-3">
                                <label class="form-label">Estudiante</label>
                                <select name="estudianteId" class="form-select" required>
                                    <option value="">Seleccionar estudiante...</option>
                                    <option th:each="e : ${estudiantes}"
                                            th:value="${e.id}"
                                            th:text="${e.nombre + ' ' + e.apellido + ' - ' + e.email}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-5 mb-3">
                                <label class="form-label">Programa</label>
                                <select name="programaId" class="form-select" required>
                                    <option value="">Seleccionar programa...</option>
                                    <option th:each="p : ${programas}"
                                            th:value="${p.id}"
                                            th:text="${p.nombre + ' - ' + p.tecnologia}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-2 mb-3 d-flex align-items-end">
                                <button type="submit" class="btn btn-success w-100">
                                    Matricular
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Tabla matrículas -->
            <div class="card">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Matrículas registradas</h5>
                </div>
                <div class="card-body">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Estudiante</th>
                                <th>Programa</th>
                                <th>Fecha inicio</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="m : ${matriculas}">
                                <td th:text="${m.id}"></td>
                                <td th:text="${m.usuario.nombre + ' ' + m.usuario.apellido}"></td>
                                <td th:text="${m.programa.nombre}"></td>
                                <td th:text="${m.fechaInicio}"></td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${m.estado.name() == 'EN_CURSO'} ? 'bg-success' :
                                                          (${m.estado.name() == 'COMPLETADO'} ? 'bg-primary' : 'bg-danger')"
                                          th:text="${m.estado}">
                                    </span>
                                </td>
                                <td>
                                    <a th:href="@{/admin/hitos/{id}(id=${m.id})}"
                                       class="btn btn-sm btn-outline-success">
                                        Ver hitos
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
