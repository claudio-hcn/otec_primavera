<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Estudiantes - OTEC Primavera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar {
            min-height: 100vh;
            background-color: #2e7d32;
        }
        .sidebar a {
            color: #c8e6c9;
            text-decoration: none;
            display: block;
            padding: 12px 20px;
        }
        .sidebar a:hover {
            background-color: #1b5e20;
            color: white;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-0">
            <div class="text-white text-center py-4">
                <h5>🌱 OTEC Primavera</h5>
            </div>
            <a th:href="@{/admin/dashboard}">📊 Dashboard</a>
            <a th:href="@{/admin/programas}">📚 Programas</a>
            <a th:href="@{/admin/estudiantes}">👥 Estudiantes</a>
            <a th:href="@{/admin/matriculas}">📋 Matrículas</a>
            <hr style="border-color: #4caf50;">
            <a th:href="@{/logout}">🚪 Cerrar Sesión</a>
        </div>

        <!-- Contenido principal -->
        <div class="col-md-10 p-4">
            <h3 class="mb-4">Gestión de Estudiantes</h3>

            <!-- Formulario registro -->
            <div class="card mb-4">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Registrar nuevo estudiante</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/estudiantes/guardar}"
                          th:object="${usuarioDTO}" method="post">
                        <div class="row">
                            <div class="col-md-3 mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" th:field="*{nombre}"
                                       class="form-control" required>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label">Apellido</label>
                                <input type="text" th:field="*{apellido}"
                                       class="form-control" required>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" th:field="*{email}"
                                       class="form-control" required>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label">Contraseña</label>
                                <input type="password" th:field="*{password}"
                                       class="form-control" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success">
                            Registrar Estudiante
                        </button>
                    </form>
                </div>
            </div>

            <!-- Tabla estudiantes -->
            <div class="card">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Estudiantes registrados</h5>
                </div>
                <div class="card-body">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>Email</th>
                                <th>Rol</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="e : ${estudiantes}">
                                <td th:text="${e.id}"></td>
                                <td th:text="${e.nombre}"></td>
                                <td th:text="${e.apellido}"></td>
                                <td th:text="${e.email}"></td>
                                <td>
                                    <span class="badge bg-primary"
                                          th:text="${e.rol}">
                                    </span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
